<div class="toast-stack" aria-live="polite" aria-atomic="true">
  @for (toast of toasts(); track toast.id) {
    <div class="toast show border-0 shadow-sm" [class.text-bg-success]="toast.type === 'success'" [class.text-bg-danger]="toast.type === 'danger'" [class.text-bg-info]="toast.type === 'info'">
      <div class="d-flex align-items-center">
        <div class="toast-body fw-semibold">{{ toast.message }}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" aria-label="Close" (click)="dismiss(toast.id)"></button>
      </div>
    </div>
  }
</div>
