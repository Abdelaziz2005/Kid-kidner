<div class="container-fluid con1">
  <div class="container con">
    <form (ngSubmit)="onSubmit()" #signupForm="ngForm">
      <div><h1 class="h1 text text-center">Sign Up</h1></div>

      <div class="mb-3 e1 form-group">
        <input type="text" class="form-control" name="name" placeholder="Name" [(ngModel)]="name" required />
      </div>

      <div class="mb-3 e1 form-group">
        <input type="number" class="form-control" name="age" placeholder="Age" [(ngModel)]="age" required />
      </div>

      <div class="mb-3 e1 form-group">
        <input type="email" class="form-control" name="email" placeholder="Email address" [(ngModel)]="email" required />
        <p class="error" *ngIf="error_m3">{{ error_m3 }}</p>
      </div>

      <div class="mb-3 e1 form-group">
        <input type="password" class="form-control" name="password" placeholder="Password" [(ngModel)]="password" required />
        <p class="error" *ngIf="error_m2">{{ error_m2 }}</p>
      </div>

      <p class="error" *ngIf="error_m">{{ error_m }}</p>

      <button type="submit" class="btn btn-primary bt1">Sign Up</button>

      <div class="register-text">
        <p>Already have an account? <a routerLink="/login">Login</a></p>
      </div>
    </form>
  </div>
</div>
